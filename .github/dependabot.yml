version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    # Mirrors `min-release-age=3` in .npmrc: nothing younger than three days
    # enters the lockfile. GitHub currently applies a 3-day default on its own,
    # so this is a no-op today — it is written explicitly so the policy survives
    # GitHub changing that default. Do not "clean it up".
    # Security updates ignore cooldown by design: a known vulnerability ships
    # day 0.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  # `cooldown` is not supported for the github-actions ecosystem — the option is
  # absent from GitHub's support table, so it is deliberately omitted here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
