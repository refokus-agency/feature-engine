version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    # A three-day floor: nothing younger than that enters the lockfile. GitHub
    # currently applies a 3-day default on its own, so this is a no-op today —
    # it is written explicitly so the policy survives GitHub changing that
    # default. Do not "clean it up". The matching install-time floor is tracked
    # in #72.
    # Security updates ignore cooldown by design: a known vulnerability ships
    # day 0.
    cooldown:
      default-days: 3
    groups:
      # `vitest` and its scoped siblings pin each other with exact peer ranges
      # (`@vitest/coverage-v8@3.2.4` peers `vitest@3.2.4`), so bumping one alone
      # produces a PR that cannot install — `npm ci` dies on ERESOLVE before any
      # check runs. Listed first because a dependency joins the first group it
      # matches, and with no `update-types` this group also catches majors, which
      # `minor-and-patch` by definition cannot.
      #
      # Every scoped package is listed by its exact name. The `@vitest/*` glob
      # alone did not hold them: on the 5.0.0 bump Dependabot put `vitest` in
      # this group (#98) and still opened standalone PRs for
      # `@vitest/coverage-v8` (#100) and `@vitest/ui` (#101) — same run, same
      # publish minute, same cooldown, so nothing but the pattern differed. The
      # glob is kept as a forward-looking catch, but a new `@vitest/*`
      # devDependency must be added here by name to actually be grouped.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/ui"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  # `cooldown` is not supported for the github-actions ecosystem — the option is
  # absent from GitHub's support table, so it is deliberately omitted here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
