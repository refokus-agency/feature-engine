name: Bug Report
description: Report a reproducible bug
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: The installed version of `@refokus-agency/feature-engine`.
      placeholder: "e.g., 1.3.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, bundler, browser, framework (e.g. Webflow).
      placeholder: |
        - Node.js:
        - Bundler:
        - Browser:
    validations:
      required: true
