# CI + semantic-release on push to main (for npm libraries).
#
# workflow_dispatch is kept as an escape hatch — lets you re-run a
# release from the Actions tab without pushing a new commit.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: refokus-agency/platform/.github/workflows/ci.yml@v1.8.1
    secrets: inherit

  # Publishes to the public npm registry via OIDC Trusted Publishing.
  # `id-token: write` is what lets npm mint the OIDC credential — without it the
  # exchange fails at runtime, because GitHub never delegates a permission the
  # caller did not grant. No NPM_TOKEN is involved anywhere.
  #
  # `provenance: true` makes npm attach a signed build attestation to the
  # tarball, which is what earns the "Built and signed on GitHub Actions" badge
  # on npmjs.com. It requires a PUBLIC repository — the publish hard-fails
  # otherwise — so it could only be turned on after the visibility flip (#60).
  #
  # `packages: write` must stay even though nothing is published to GitHub
  # Packages anymore. The reusable workflow's `publish` job declares it
  # unconditionally, and a called workflow may not request a permission the
  # caller withheld — GitHub fails the run at startup rather than downgrading it.
  # Dropping it here is what produced the `startup_failure` on run 31714017756.
  release:
    needs: ci
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write
    uses: refokus-agency/platform/.github/workflows/release.yml@v1.8.1
    with:
      registry: npm
      provenance: true
    secrets: inherit
